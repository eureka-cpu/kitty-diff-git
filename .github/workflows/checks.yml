name: checks

on:
  push:
    branches: [master]
  pull_request:

jobs:
  install-script:
    # The VM test needs an x86_64-linux host with KVM; GitHub's Linux runners
    # expose /dev/kvm.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Give the current user access to /dev/kvm (present on the runner, but not
      # group-accessible by default).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: DeterminateSystems/nix-installer-action@main

      # Runs the VM-test driver directly (not a sandboxed build), so it has the
      # network apt-get needs. Builds the Ubuntu image + driver first, then boots.
      - name: Run install.sh VM test
        run: nix run .#install-script-test
